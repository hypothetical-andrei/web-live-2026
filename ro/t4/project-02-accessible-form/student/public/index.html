<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Lab enrollment</title><link rel="stylesheet" href="/styles.css"></head><body><main><h1>Lab enrollment</h1><div id="error-summary" tabindex="-1" hidden><h2>Correct these fields</h2><ul></ul></div><form id="enrollment" novalidate><label for="name">Name</label><input id="name" name="name" autocomplete="name" required aria-describedby="name-error"><p id="name-error" class="error"></p><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required aria-describedby="email-error"><p id="email-error" class="error"></p><fieldset><legend>Learning track</legend><label><input id="track" type="radio" name="track" value="frontend" required aria-describedby="track-error"> Frontend</label><label><input type="radio" name="track" value="backend" aria-describedby="track-error"> Backend</label><p id="track-error" class="error"></p></fieldset><label><input id="terms" type="checkbox" name="terms" required aria-describedby="terms-error"> I accept the lab rules</label><p id="terms-error" class="error"></p><button>Enroll</button></form><p id="success" aria-live="polite"></p></main><script type="module" src="/app.js"></script><script type="module">if(new URLSearchParams(location.search).has('browser-smoke'))import('/browser-smoke.js')</script></body></html>
